<h2>Nytt passord til Vinskap</h2>
<p>Åpne Vinskap-appen, velg «Aktiver konto» og skriv inn e-postadressen din, denne koden og et nytt passord:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:0.2em">{{ .Token }}</p>
<p>Koden gjelder i én time. Har du ikke bedt om nytt passord, kan du se bort fra denne e-posten.</p>
